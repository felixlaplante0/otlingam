name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build ${{ matrix.name }} wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS x86-64
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-14
          - name: Windows x86-64
            runner: windows-latest
            msystem: UCRT64
            toolchain_bin: ucrt64
            toolchain: mingw-w64-ucrt-x86_64-toolchain
            cc: gcc
            cxx: g++
          - name: Windows ARM64
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain_bin: clangarm64
            toolchain: mingw-w64-clang-aarch64-toolchain
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MinGW toolchain
        if: startsWith(matrix.name, 'Windows')
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.toolchain }}
      - name: Add MinGW to PATH
        if: startsWith(matrix.name, 'Windows')
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\${{ matrix.toolchain_bin }}\bin"
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: "cp3*-*"
          CIBW_SKIP: "*-musllinux_* cp3??t-*"
          CIBW_ARCHS: native
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: "python -m pytest tests"
          CIBW_ENVIRONMENT_WINDOWS: >-
            CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  publish-to-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_TOKEN }}
