name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build ${{ matrix.name }} wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS x86-64
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-14
          - name: Windows x86-64
            runner: windows-latest
            clang: true
          - name: Windows ARM64
            runner: windows-11-arm
            clang: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: "cp3*-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: native
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: "python -m pytest tests"
          CIBW_BEFORE_ALL_WINDOWS: ${{ matrix.clang && 'choco install llvm -y --no-progress' || '' }}
          CIBW_ENVIRONMENT_WINDOWS: ${{ matrix.clang && 'OTLINGAM_CLANG_CL="C:\Program Files\LLVM\bin\clang-cl.exe"' || '' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  publish-to-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_TOKEN }}
